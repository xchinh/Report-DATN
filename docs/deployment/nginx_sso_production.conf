# ==============================================================================
# HCMUT CENTRAL SSO & IN-APP WEBVIEW PRODUCTION REVERSE PROXY CONFIGURATION
# Domains: hrm.hcmut.edu.vn, ioffice.hcmut.edu.vn
# Upstreams: HRM FE (6022), HRM BE (6023), iOffice FE (3000), iOffice BE (3001)
# Features: SSL Termination, HTTP/2, WebSocket Upgrades, Security Headers, Port 80 -> 443 Redirect
# ==============================================================================

# User & Process Architecture
# user nginx; # Managed by container runtime / systemd
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration (In container runtime /var/log/nginx/ is standard)
    access_log /var/log/nginx/access.log combined;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Request Size Limits (Aligned with 50MB Backend Upload Limit)
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # Proxy Buffer Tuning (Prevent truncation of large SSO headers / cookies)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # Gzip Compression for Text & JSON Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # WebSocket / Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ==============================================================================
    # UPSTREAM DEFINITIONS
    # Aligned with Frozen Network Matrix (Host / Container endpoints)
    # ==============================================================================

    # 1. HRM Frontend (React / Vite Static Single Page App - Port 6022)
    upstream hrm_fe {
        server 127.0.0.1:6022; # Replace with hrm-fe:6022 in bridged container network
        keepalive 32;
    }

    # 2. HRM Backend (SSO Issuer & HRM Consumer BE - Port 6023)
    upstream hrm_be {
        server 127.0.0.1:6023; # Replace with hrm-be:6023 in bridged container network
        keepalive 32;
    }

    # 3. iOffice Frontend (React / Vite Static Single Page App - Port 3000)
    upstream ioffice_fe {
        server 127.0.0.1:3000; # Replace with ioffice-fe:3000 in bridged container network
        keepalive 32;
    }

    # 4. iOffice Backend (iOffice Consumer BE - Port 3001)
    upstream ioffice_be {
        server 127.0.0.1:3001; # Replace with ioffice-be:3001 in bridged container network
        keepalive 32;
    }

    # ==============================================================================
    # PORT 80 -> HTTPS (443) REDIRECT BLOCK
    # Enforces strict transport security for both official domains
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name hrm.hcmut.edu.vn ioffice.hcmut.edu.vn;

        # Health check endpoint for ingress / load balancer probes
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # SERVER BLOCK: hrm.hcmut.edu.vn (SSL 443, HTTP/2)
    # Serves HRM Single Page App and Proxies /api/ to HRM Backend
    # ==============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hrm.hcmut.edu.vn;

        # SSL Certificates
        # Relative to Nginx prefix or mounted to /etc/nginx/certs/
        ssl_certificate certs/hrm.hcmut.edu.vn.crt;
        ssl_certificate_key certs/hrm.hcmut.edu.vn.key;

        # TLS Protocols & Cipher Suite
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL_HRM:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --------------------------------------------------------------------------
        # 1. Reverse Proxy /api/ -> HRM Backend (Issuer & Consumer)
        # --------------------------------------------------------------------------
        location /api/ {
            proxy_pass http://hrm_be;
            proxy_http_version 1.1;

            # Proxy Headers (Crucial for trust proxy & cookie security)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 2. WebSocket / Socket.IO -> HRM Backend
        # --------------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://hrm_be;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 3. Reverse Proxy / -> HRM Frontend (SPA Static Server / Vite)
        # --------------------------------------------------------------------------
        location / {
            proxy_pass http://hrm_fe;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Support WebSocket for Dev / HMR if active
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ==============================================================================
    # SERVER BLOCK: ioffice.hcmut.edu.vn (SSL 443, HTTP/2)
    # Serves iOffice Single Page App and Proxies /api/ to iOffice Backend
    # ==============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ioffice.hcmut.edu.vn;

        # SSL Certificates
        ssl_certificate certs/ioffice.hcmut.edu.vn.crt;
        ssl_certificate_key certs/ioffice.hcmut.edu.vn.key;

        # TLS Protocols & Cipher Suite
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL_IOFFICE:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --------------------------------------------------------------------------
        # 1. Reverse Proxy /api/ -> iOffice Backend (Consumer)
        # --------------------------------------------------------------------------
        location /api/ {
            proxy_pass http://ioffice_be;
            proxy_http_version 1.1;

            # Proxy Headers (Crucial for trust proxy & cookie security)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts for document uploads & processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 2. WebSocket / Socket.IO -> iOffice Backend
        # --------------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://ioffice_be;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 3. Reverse Proxy / -> iOffice Frontend (SPA Static Server / Vite)
        # --------------------------------------------------------------------------
        location / {
            proxy_pass http://ioffice_fe;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Support WebSocket for Dev / HMR if active
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
